[package]
name = "beamfs-upstream"
version = "0.8.1"
edition = "2021"
authors = ["Aurelien DESBRIERES <aurelien@hackers.camp>"]
license = "GPL-2.0-only"
description = "The checks a kernel patch series passes before it is mailed, shared by beamfs-bench and beamfs-xfstests"
repository = "https://github.com/roastercode/beamfs-upstream"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.10"
